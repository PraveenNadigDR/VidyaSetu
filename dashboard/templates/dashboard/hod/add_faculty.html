{% extends "dashboard/base.html" %}

{% block title %}Add Faculty | Vidya Setu{% endblock %}
{% block page_title %}Add New Faculty{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card bg-white border-0 shadow-sm">
      <div class="card-body p-5">
        <form method="POST">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Full Name</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Faculty ID (Username)</label>
              <input type="text" name="faculty_id" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Department</label>
              <input type="text" name="department" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold small text-muted">Assign Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
          </div>
          <div class="mt-4 text-end">
            <a href="{% url 'hod_faculty' %}" class="btn btn-light me-2">Cancel</a>
            <button type="submit" class="btn btn-primary">Register Faculty</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
