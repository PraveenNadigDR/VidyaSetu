{% extends "dashboard/base.html" %}

{% block title %}Profile | Vidya Setu{% endblock %}
{% block page_title %}Faculty Profile{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-8 mx-auto">
    <div class="card bg-white border-0 shadow-sm text-center py-5">
      <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 shadow" style="width: 100px; height: 100px; font-size: 36px; font-weight: bold;">
        <i class="bi bi-person"></i>
      </div>
      <h3 class="fw-bold mb-1">{{ faculty.name }}</h3>
      <p class="text-muted mb-4">{{ faculty.department }} &bull; {{ faculty.faculty_id }}</p>
      
      <div class="d-flex justify-content-center gap-3">
        <div class="badge bg-light text-dark p-2 px-3 border rounded-pill">
          {{ faculty.email }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
